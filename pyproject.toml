[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-workflow"
version = "1.0.0"
description = "AI Development Workflow for NextJS and Unity projects"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Robert Crossland", email = "robertcrossland@proton.me"}
]
maintainers = [
    {name = "Robert Crossland", email = "robertcrossland@proton.me"}
]
keywords = ["ai", "development", "workflow", "nextjs", "unity", "automation", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "gitpython>=3.1.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
github = [
    "PyGithub>=1.58.0",
]

[project.scripts]
ai-workflow = "ai_dev_workflow.cli:main"
ai-setup = "ai_dev_workflow.setup:main"

[project.urls]
Homepage = "https://github.com/robcross1977/ai-dev-workflow"
Repository = "https://github.com/robcross1977/ai-dev-workflow"
Documentation = "https://github.com/robcross1977/ai-dev-workflow#readme"
"Bug Reports" = "https://github.com/robcross1977/ai-dev-workflow/issues"

[tool.setuptools]
packages = ["ai_dev_workflow"]

[tool.setuptools.package-data]
ai_dev_workflow = ["*.json", "*.md", "*.yaml", "*.yml"]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short" 